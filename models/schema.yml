version: 2

sources:
  - name: raw
    schema: gz_raw_data
    description: "Raw GreenZilla data stored in BigQuery."
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: "Raw sales transactions (orders, revenue, quantity)."
      - name: product
        identifier: raw_gz_product
        description: "Raw product data with product IDs and purchase price."
      - name: ship
        identifier: raw_gz_ship
        description: "Raw shipping information (fees and cost)."
